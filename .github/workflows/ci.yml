name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Sample catalog is in sync with its generator
        run: |
          python scripts/generate_sample_catalog.py
          git diff --exit-code data/catalog.yaml
      - name: Readiness scorecard
        run: |
          storefront-readiness check --format md --out reports/scorecard.md
          storefront-readiness check --format json --out reports/scorecard.json
          cat reports/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Demo builds and passes the tool's own accessibility checks
        run: python demo/build.py --out demo/dist
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: |
            reports/
            demo/dist/
