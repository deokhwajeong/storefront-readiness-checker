# Market rule pack: Germany.
# Illustrative rules for a fictional storefront. Not legal advice and not a
# statement of any jurisdiction's actual requirements.
market: DE
name: Germany
notes: "German strings run long; the title limit is the tile limit, not a translation guideline."
locales:
  required: [de-DE]
  fallback: {}
translation:
  required_fields: [title, description, screenshot_alt]
  min_completeness: 0.98
string_limits:
  title: {max: 30, unit: chars, severity: blocker}
  description: {max: 320, unit: chars, severity: warning}
age_rating:
  scheme: numeric-5
pricing:
  currency: "EUR"
  symbol: "€"
  position: "suffix"
  space: true
  decimal: ","
  group: "."
  decimals: 2
legal:
  required_links: [terms, privacy, imprint]
content:
  loot_boxes: {action: min_rating, min: "12"}
accessibility:
  required: false
  standard: "WCAG 2.0 Level AA"
