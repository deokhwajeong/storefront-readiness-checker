# Market rule pack: United States.
# Illustrative rules for a fictional storefront. Not legal advice and not a
# statement of any jurisdiction's actual requirements.
market: US
name: United States
notes: "Accessibility conformance is treated as a launch gate for this market in this sample."
locales:
  required: [en-US]
  fallback: {}
translation:
  required_fields: [title, description, screenshot_alt]
  min_completeness: 0.98
string_limits:
  title: {max: 30, unit: chars, severity: blocker}
  description: {max: 320, unit: chars, severity: warning}
age_rating:
  scheme: letter-4
pricing:
  currency: "USD"
  symbol: "$"
  position: "prefix"
  space: false
  decimal: "."
  group: ","
  decimals: 2
legal:
  required_links: [terms, privacy]
content:
  simulated_gambling: {action: review}
accessibility:
  required: true
  standard: "WCAG 2.0 Level AA"
