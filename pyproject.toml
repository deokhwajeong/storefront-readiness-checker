[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "storefront-readiness-checker"
version = "0.1.0"
description = "Per-market launch readiness scorecard for a multi-locale app storefront: localization, ratings, pricing, legal links, content rules, and automated accessibility checks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Deokhwa Jeong" }]
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
storefront-readiness = "storefront_readiness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Multilingual sample data and full-width test strings are intentional.
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_sample_catalog.py" = ["E501"]
"demo/build.py" = ["E501"]  # inline HTML and SVG markup
